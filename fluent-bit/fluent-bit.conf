# Fluent Bit — collects WooCommerce store logs and ships them to OpenSearch.
#
# Sources (5, matching the homework):
#   - Nginx      (access + error)         → woocommerce-nginx-*
#   - MySQL      (error + slow query)     → woocommerce-mysql-*
#   - PHP-FPM    (access)                 → woocommerce-php-*
#   - Docker     (container stdout)       → woocommerce-container-*
#   - Linux      (systemd journald)       → woocommerce-linux-*

[SERVICE]
    Flush           5
    Daemon          Off
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf
    Parsers_File    /fluent-bit/etc/parsers_custom.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

# ── Nginx ─────────────────────────────────────────────────────────────────
[INPUT]
    Name             tail
    Path             /var/log/woocommerce/nginx/access.log
    Tag              wc.nginx.access
    Parser           nginx
    DB               /fluent-bit/state/nginx_access.db
    Mem_Buf_Limit    10MB
    Skip_Long_Lines  On
    Refresh_Interval 5

[INPUT]
    Name             tail
    Path             /var/log/woocommerce/nginx/error.log
    Tag              wc.nginx.error
    Parser           nginx_error
    DB               /fluent-bit/state/nginx_error.db
    Mem_Buf_Limit    10MB
    Refresh_Interval 5

# ── MySQL / MariaDB ───────────────────────────────────────────────────────
[INPUT]
    Name             tail
    Path             /var/log/woocommerce/mysql/error.log
    Tag              wc.mysql.error
    Parser           mariadb_error
    DB               /fluent-bit/state/mysql_error.db
    Mem_Buf_Limit    10MB
    Refresh_Interval 5
    Read_From_Head   On

[INPUT]
    Name             tail
    Path             /var/log/woocommerce/mysql/mysql-slow.log
    Tag              wc.mysql.slow
    DB               /fluent-bit/state/mysql_slow.db
    Mem_Buf_Limit    10MB
    Refresh_Interval 5
    Read_From_Head   On

# ── PHP-FPM ───────────────────────────────────────────────────────────────
[INPUT]
    Name             tail
    Path             /var/log/woocommerce/php/*.log
    Tag              wc.php
    DB               /fluent-bit/state/php.db
    Mem_Buf_Limit    10MB
    Refresh_Interval 5

# ── Docker container logs (store containers + host's k8s pods) ────────────
[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*-json.log
    Tag              wc.container
    Parser           docker
    DB               /fluent-bit/state/docker.db
    Mem_Buf_Limit    20MB
    Refresh_Interval 5

# ── Linux system logs (systemd journald) ──────────────────────────────────
[INPUT]
    Name              systemd
    Tag               wc.linux
    Path              /var/log/journal
    DB                /fluent-bit/state/systemd.db
    Read_From_Tail    On
    Strip_Underscores On

# ── Output → OpenSearch (HTTPS, self-signed demo cert) ────────────────────
#   One OUTPUT per source tag → a daily index per component. The OpenSearch
#   output plugin params (lowercase in 5.x docs; keys are case-insensitive):
#     http_user / http_passwd   basic auth  (note: *_passwd, NOT *_pwd)
#     suppress_type_name On     REQUIRED for OpenSearch 2.x+ (mapping types removed)
#     tls On / tls.verify Off   TLS on, skip cert verify for the self-signed demo cert
[OUTPUT]
    Name                opensearch
    Match               wc.nginx.*
    Host                os-node
    Port                9200
    HTTP_User           observability
    HTTP_Passwd         ${OBS_PASSWORD}
    Logstash_Format     On
    Logstash_Prefix     woocommerce-nginx
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Replace_Dots        On
    Include_Tag_Key     On
    Tag_Key             log_source
    tls                 On
    tls.verify          Off
    Retry_Limit         5

[OUTPUT]
    Name                opensearch
    Match               wc.mysql.*
    Host                os-node
    Port                9200
    HTTP_User           observability
    HTTP_Passwd         ${OBS_PASSWORD}
    Logstash_Format     On
    Logstash_Prefix     woocommerce-mysql
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Replace_Dots        On
    Include_Tag_Key     On
    Tag_Key             log_source
    tls                 On
    tls.verify          Off
    Retry_Limit         5

[OUTPUT]
    Name                opensearch
    Match               wc.php
    Host                os-node
