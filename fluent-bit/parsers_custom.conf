# Custom parsers for the WooCommerce store's log formats.
# (Built-in `nginx` and `docker` parsers cover nginx access + container JSON.)

# Nginx error log:   2026/07/27 08:43:06 [notice] 1#1: start worker process 23
[PARSER]
    Name        nginx_error
    Format      regex
    Regex       ^(?<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>\w+)\] (?<pid>\d+)#(?<tid>\d+):(?: \*(?<cid>\d+))? ?(?<message>.*)$
    Time_Key    time
    Time_Format %Y/%m/%d %H:%M:%S

# MariaDB error log:   2026-07-27  8:43:10 0 [Note] mariadbd: ready for connections.
[PARSER]
    Name        mariadb_error
    Format      regex
    Regex       ^(?<time>\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}:\d{2})\s+\d+\s+\[(?<level>[^\]]+)\]\s*(?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S
